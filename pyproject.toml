[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tau-timing"
version = "0.1.0"
description = "Infer copy number amplification timing in tumor genomes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Park Lab", email = "peter_park@hms.harvard.edu"}
]
keywords = ["bioinformatics", "cancer", "genomics", "copy-number", "timing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "h5py>=3.0",
    "pysam>=0.19",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "tqdm>=4.62",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# CLI entry point - use `python -m scripts.run_tau` instead
# [project.scripts]
# tau = "scripts.run_tau:main"

[project.urls]
Homepage = "https://github.com/parklab/tau"
Documentation = "https://github.com/parklab/tau"
Repository = "https://github.com/parklab/tau"

[tool.setuptools]
packages = ["tau"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
tau = ["data/*.tsv", "data/*.sobj", "data/*.h5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
